services:
  fastapi:
    build:
      context: .
    image: expense-management-app:latest
    container_name: fastapi_app
    environment:
      - DB_URL=sqlite:////app/data/expense_app.db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-me-in-production-0123456789abcdef}
    ports:
      - "8000:8000"
    volumes:
      - ./:/app/data
    restart: unless-stopped
